[tools]
node = "lts"
bun = "latest"
fastfetch = "latest"
starship = "latest"
python = "latest"
ruby = "latest"
pdm = "latest"
go = "latest"
terraform = "latest"
tree-sitter = "latest"
pre-commit = "latest"
usage = "latest"
uv = "latest"
terraform-ls = "latest"
direnv = "latest"

[env]
npm_config_update_notifier = "false"
npm_config_progress = "false"
npm_config_loglevel = "warn"
MISE_ENV_FILE = ".env"

[settings]
idiomatic_version_file_enable_tools = ["node", "python"]
