# Starship prompt — agnoster powerline theme.
# Symlinked to ~/.config/starship.toml by settings.py.
# Replaces the previous Powerlevel10k config (dots/p10k.zsh).
#
# Powerline look: each segment is a solid colored background block joined by the
# agnoster arrow glyphs (\uE0B0 left, \uE0B2 right). Each segment paints its arrow
# in "fg = previous segment's bg, bg = this segment's bg" so the blocks chain
# seamlessly. Requires a Nerd/Powerline font (you already install several).
#
# Color map (matches dots/p10k.zsh, ANSI named colors):
#   dir        black on blue   (p10k DIR fg=0 bg=4)
#   git        black on green — branch only, no dirty/status markers (uses starship's
#              internal git, no spawned git processes, so it stays fast).
#   context    white on blue (remote), white on yellow (root)
#   status err white on red
#   cmd time   white on grey (bright-black)
#
# Speed notes:
#   - starship is a single static Rust binary with no background daemon.
#   - `command_timeout` / `scan_timeout` cap per-module work so the prompt never stalls.
#   - kubernetes is gated behind `detect_*` and aws behind profile presence.

# Single line, prompt char on the same line (matches p10k PROMPT_ON_NEWLINE=false).
add_newline = false

# Cap per-module work so the prompt always stays snappy (milliseconds).
command_timeout = 500
scan_timeout = 30

# Left:  context -> dir -> git    (then closing arrow + prompt char)
# Right: status -> cmd duration -> jobs -> kube -> aws
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$character"""

right_format = """
$status\
$cmd_duration\
$jobs\
$kubernetes\
$aws"""

# No fill content needed for a single-line prompt.

# --- Prompt indicator: a shaded block (not a bare char), agnoster-style. ---
# It opens its own block from the terminal bg, so it works whether or not a git
# segment preceded it. Green block normally, red on error; closes with an arrow
# back into the bg. This replaces the bare ❯.
[character]
success_symbol = "[ ❯ ](fg:black bg:green bold)[](fg:green)"
error_symbol = "[](fg:green bg:red)[ ❯ ](fg:white bg:red bold)[](fg:red)"
vimcmd_symbol = "[ ❮ ](fg:black bg:green bold)[](fg:green)"

# --- Context: user@host — only over SSH or for root (p10k ALWAYS_SHOW_CONTEXT=false) ---
# When shown it's the first segment and uses a blue bg matching dir, so the context->dir
# seam is invisible (blue->blue) with no separator glyph needed. Root uses a yellow bg.
[username]
style_user = "fg:white bg:blue bold"
style_root = "fg:white bg:yellow bold"
format = "[ $user ]($style)"
show_always = false

[hostname]
ssh_only = true
style = "fg:white bg:blue bold"
format = "[@$hostname ]($style)"

# --- Directory (p10k: black on blue, truncate to unique, length 4) ---
# Ends with the blue->green crossover arrow; the next block (git or prompt char) is
# always green, so the seam is correct with or without a git segment.
[directory]
style = "fg:black bg:blue bold"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
format = "[ $path ]($style)[](fg:blue bg:green)"

# --- Git (built-in modules: read .git in-process, no spawned git/bash) ---
# The directory block always ends with the blue->green crossover arrow, and the
# prompt char is itself a green block, so the chain stays seamless whether or not
# a git segment renders: outside a repo the crossover runs straight into the green
# prompt char. No trailing arrow on git: it is green into the green prompt char,
# so they merge into one block. Branch when attached, short commit hash when detached.
[git_branch]
only_attached = true
symbol = "\uE0A0 "
style = "fg:black bg:green bold"
format = "[ $symbol$branch ]($style)"

[git_commit]
only_detached = true
tag_disabled = true
style = "fg:black bg:green bold"
format = "[ \uE0A0 $hash ]($style)"

# --- Right prompt: status (exit code), only on error like p10k STATUS_OK=false ---
[status]
disabled = false
style = "fg:white bg:red bold"
symbol = "✘ "
format = "[](fg:red)[ $symbol$status ]($style)"
map_symbol = true

# --- Command execution time (p10k threshold 3s) ---
[cmd_duration]
min_time = 3000
style = "fg:white bg:bright-black bold"
format = "[](fg:bright-black)[  $duration ]($style)"

# --- Background jobs ---
[jobs]
symbol = "✦"
style = "fg:white bg:blue bold"
format = "[](fg:blue)[ $symbol$number ]($style)"

# --- Kubernetes ---
# p10k only showed this for kube commands. Starship can't gate on the typed command,
# so scope it to directories that actually contain k8s manifests/charts.
[kubernetes]
disabled = false
style = "fg:black bg:cyan bold"
format = '[](fg:cyan)[ ⎈ $context(\($namespace\)) ]($style)'
detect_files = ['k8s.yaml', 'kustomization.yaml', 'Chart.yaml', 'skaffold.yaml']
detect_extensions = []
detect_folders = ['k8s', 'kubernetes', 'helm', 'charts']

# --- AWS ---
# p10k only showed AWS for aws/terraform/cdk/... commands. Starship can't gate on the
# typed command, and your zshrc always exports AWS_REGION — so only the active *profile*
# is shown (empty profile -> the whole block collapses). Region is omitted by design.
[aws]
style = "fg:black bg:yellow bold"
symbol = " "
format = '([](fg:yellow)[ $symbol$profile ]($style))'
force_display = false
